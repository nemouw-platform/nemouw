<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::section})}">
<body>
<section>
    <h1 style="margin:0 0 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:700;color:#2E1840;"
        th:text="#{mail.password_reset.heading}">Reset your password</h1>
    <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:16px;line-height:24px;color:#4B4256;"
       th:text="#{mail.password_reset.intro}">Intro</p>

    <div th:replace="~{components.html :: button(${link}, #{mail.password_reset.cta})}"></div>

    <p style="margin:0 0 20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:14px;line-height:20px;color:#6B6277;"
       th:text="#{mail.password_reset.expires(${minutes})}">Expires in 60 minutes.</p>

    <p style="margin:0 0 6px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:13px;line-height:18px;color:#6B6277;"
       th:text="#{mail.password_reset.fallback}">If the button does not work, copy this link:</p>
    <p dir="ltr" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:13px;line-height:18px;word-break:break-all;">
        <a th:href="${link}" th:text="${link}" style="color:#502668;">https://...</a>
    </p>
</section>
</body>
</html>
