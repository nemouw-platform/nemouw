<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)"
      th:attr="lang=${lang},dir=${dir}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title th:text="${subject}">Nemouw</title>
</head>
<body style="margin:0;padding:0;background-color:#F6F2F8;">
<!-- Preheader: the preview text inbox lists show after the subject -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;" th:text="${preheader}">Preheader</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F2F8;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

                <!-- Brand -->
                <tr>
                    <td align="center"
                        style="padding:0 0 20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:700;letter-spacing:0.5px;color:#502668;"
                        th:text="${brand}">Nemouw</td>
                </tr>

                <!-- Card -->
                <tr>
                    <td th:attr="dir=${dir}"
                        style="background-color:#FFFFFF;border:1px solid #E7DEEE;border-radius:12px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;color:#2E1840;">
                        <th:block th:replace="${content}">content goes here</th:block>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="padding:24px 16px 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:12px;line-height:18px;color:#6B6277;">
                        <span th:text="#{mail.footer.unrequested}">Footer note</span><br>
                        &copy; <span th:text="${year}">2026</span> <span th:text="${brand}">Nemouw</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
