<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- One-time code box. dir=ltr keeps digits in order inside RTL emails. -->
<table th:fragment="codeBox(code)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:28px 0;">
    <tr>
        <td align="center" dir="ltr"
            style="background-color:#F1EAF6;border:1px solid #DCCDE8;border-radius:10px;padding:18px 12px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:34px;line-height:40px;font-weight:700;letter-spacing:10px;color:#502668;"
            th:text="${code}">123456</td>
    </tr>
</table>

<!-- Call-to-action button (table-based so it renders in Outlook too) -->
<table th:fragment="button(url, label)" role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"
       style="margin:28px auto;">
    <tr>
        <td align="center" bgcolor="#502668" style="background-color:#502668;border-radius:8px;">
            <a th:href="${url}" target="_blank"
               style="display:inline-block;padding:14px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:600;color:#FFFFFF;text-decoration:none;border-radius:8px;"
               th:text="${label}">Button</a>
        </td>
    </tr>
</table>

</body>
</html>
