<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::section})}">
<body>
<section>
    <h1 class="c-head" style="margin:0 0 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:700;color:#2E1840;"
        th:text="#{mail.invite.heading}">Reset your password</h1>
    <p class="c-body" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:16px;line-height:24px;color:#4B4256;"
       th:text="#{mail.invite.intro}">Intro</p>

    <div th:replace="~{components.html :: button(${link}, #{mail.invite.cta})}"></div>

    <p class="c-muted" style="margin:0 0 20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:14px;line-height:20px;color:#6B6277;"
       th:text="#{mail.invite.expires(${hours})}">Expires in 24 hours.</p>

    <p class="c-muted" style="margin:0 0 6px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:13px;line-height:18px;color:#6B6277;"
       th:text="#{mail.invite.fallback}">If the button does not work, copy this link:</p>
    <p dir="ltr" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,Arial,sans-serif;font-size:13px;line-height:18px;word-break:break-all;">
        <a th:href="${link}" th:text="${link}" class="c-link" style="color:#502668;">https://...</a>
    </p>
</section>
</body>
</html>
