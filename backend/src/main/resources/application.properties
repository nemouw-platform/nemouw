spring.application.name=nemouw-backend

# ---- Flyway ----
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- JSON (was Json.MAPPER) ----
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---- Logging ----
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id}] %logger{36} - %msg %kvp%n
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENV:local}
logging.file.name=${LOG_FILE:}
logging.pattern.file=${logging.pattern.console}
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}-%i.log.gz
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=14

# ---- Modulith ----
spring.modulith.detection-strategy=explicitly-annotated

# ---- App settings. Reads the env var name.
# ---- The ':' defaults make startup validation report ALL missing values at once.
app.security.jwt-secret=${JWT_SECRET:}
app.security.otp-hash-secret=${OTP_HASH_SECRET:}
app.security.cookie-secure=${COOKIE_SECURE:true}
app.security.trust-proxy=${TRUST_PROXY:false}
app.security.access-ttl-seconds=${ACCESS_TTL_SECONDS:900}
app.security.refresh-ttl-days=${REFRESH_TTL_DAYS:90}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allow-localhost-origins=${ALLOW_LOCALHOST_ORIGINS:false}

app.rate-limit.requests-per-second=${DDOS_SHIELD_REQUEST_LIMIT_PER_SECOND:5}

app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.url-base=${URL_BASE:}

app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}

# ---- User module (tunable values, override per environment with e.g. APP_USER_TOKEN_OTP_TTL=5m) ----
# Durations: 60s, 10m, 1h, 24h
app.user.token.max-otp-attempts=5
app.user.token.invite-ttl=24h
app.user.token.otp.ttl=10m
app.user.token.otp.cooldown=60s
app.user.token.otp.window=15m
app.user.token.otp.send-cap=3
app.user.token.otp.daily-cap=10
app.user.token.reset.ttl=1h
app.user.token.reset.cooldown=60s
app.user.token.reset.window=1h
app.user.token.reset.send-cap=3
app.user.token.reset.daily-cap=10

# OWASP minimum for Argon2id: 19 MiB, 2 iterations, 1 lane. Tune upward on your hardware.
app.user.password.argon2.memory-kb=19456
app.user.password.argon2.iterations=2
app.user.password.argon2.parallelism=1
app.user.password.argon2.salt-length=16
app.user.password.argon2.hash-length=32

app.user.session.refresh-reuse-grace=10s

app.user.signup.setup-ttl=15m