        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistLocation"
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "409":
          description: A location with these coordinates already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: LOCATION_ALREADY_EXISTS
                message: This location is already saved
        "422":
          $ref: "#/components/responses/ValidationError"
  "/specialists/me/locations/{locationId}":
    put:
      operationId: updateLocation
      tags:
        - Profile Management
      summary: Replace a location
      description: |
        Full replacement. Demoting the current primary is refused with 409.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistLocationWriteRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistLocation"
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate coordinates, or the current primary was demoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: PRIMARY_LOCATION_REQUIRED
                message: A primary location is required, make another location primary first
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteLocation
      tags:
        - Profile Management
      summary: Remove a location
      description: |
        Also removes its availability windows. The primary can’t be removed while others exist.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "204":
          description: Location removed
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The primary location cannot be removed while others exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: PRIMARY_LOCATION_REQUIRED
                message: A primary location is required, make another location primary first
