openapi: 3.0.3
info:
  title: Nemouw
  version: 0.1.0
  description: |
    Authentication, account provisioning, specialist onboarding and verification, and public discovery.

    **Signup** takes three steps: `signup`, `verifySignupOtp`, `setInitialPassword`.

    **Errors** use the `Error` schema. `422` adds a field-level `errors` array. `trace_id` identifies the request in server logs.

    **Uploads** are sent as `multipart/form-data` to the resource they belong to and stored as WebP when they are images. Profile and cover images are public; credential documents are private. 

    Browser calls are limited to allowlisted origins; other origins get a plain-text `403` from the CORS layer.
servers:
  - url: "http://localhost:8080/v1"
    description: Local development
  - url: "https://staging-api.nemouw.com/v1"
    description: Staging
  - url: "https://api.nemouw.com/v1"
    description: Production
tags:
  - name: Auth
    description: Signup, login, session, and password management
  - name: Account
    description: The authenticated user's own account
  - name: Admins
    description: Admin provisioning and access
  - name: User Management
    description: Admin-only account management across roles
  - name: Specialties & Conditions
    description: Reference data
  - name: Countries
    description: Reference data
  - name: Syndicates
    description: Syndicate directory and staff management
  - name: Specialist Management
    description: Specialist rosters for syndicate staff and admins
  - name: Verification
    description: Credential review and specialist moderation
  - name: Specialists
    description: The specialist's own profile, images, and onboarding
  - name: Specialist Profile Content
    description: Per-locale profile content
  - name: Profile Management
    description: Locations, availability, treated conditions, and template
  - name: Credentials
    description: The specialist's own credentials and their documents
  - name: Specialist Analytics
    description: The specialist's own performance figures
  - name: Discovery
    description: Public search and profile browsing
  - name: Analytics
    description: Public event tracking
security:
  - cookieAuth: []
paths:
  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  /auth/signup:
    post:
      operationId: signup
      tags:
        - Auth
      summary: Sign up (step 1 of 3)
      description: |
        Creates a pending account and emails a one-time code. Next: verifySignupOtp. Only SignupRole roles can self-register.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created, code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "409":
          description: The email belongs to a non-pending account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: EMAIL_TAKEN
                message: Email is already registered
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-otp:
    post:
      operationId: verifySignupOtp
      tags:
        - Auth
      summary: Verify the signup code (step 2 of 3)
      description: |
        Proves mailbox ownership and sets a short-lived setup cookie, accepted only by setInitialPassword. Every failure returns the same 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Mailbox verified, setup cookie set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSetupCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSetupResponse"
        "400":
          $ref: "#/components/responses/InvalidOrExpiredToken"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/resend-otp:
    post:
      operationId: resendSignupOtp
      tags:
        - Auth
      summary: Resend the signup code
      description: |
        Always 202, so account existence is not revealed. Throttled per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpRequest"
      responses:
        "202":
          description: Code re-sent if the account is eligible
        "400":
          $ref: "#/components/responses/MalformedJson"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/setup:
    post:
      operationId: setInitialPassword
      tags:
        - Auth
      summary: Choose a password and start the session (step 3 of 3)
      description: |
        Sets the first password, activates the account, and starts a session. Needs the setup cookie from verifySignupOtp.
      security:
        - passwordSetupCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Password set, session started
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetAuthCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Log in
      description: |
        identifier is an email, phone, or username. Wrong credentials, unknown identifiers, and deleted accounts all return 401; only a correct password reveals a suspended or unverified account (403).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated, session cookies set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetAuthCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          description: The password was correct but the account cannot log in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                suspended:
                  value:
                    status: 403
                    code: ACCOUNT_SUSPENDED
                    message: This account has been suspended for violating our terms of service. Please contact support if you believe this is a mistake.
                notVerified:
                  value:
                    status: 403
                    code: ACCOUNT_NOT_VERIFIED
                    message: Your account is not verified yet. Please verify your email to log in.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - Auth
      summary: Rotate the session
      description: |
        Rotates both cookies. Refresh tokens are single-use; reuse after a short grace window revokes the session.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "200":
          description: Session rotated
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetAuthCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Log out
      description: Revokes the refresh token if present and clears both cookies. Always `204`.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "204":
          description: Session ended, cookies cleared
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearAuthCookies"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags:
        - Auth
      summary: Request a password reset email
      description: |
        Always `202`, so account existence is not revealed. Throttled per account; `429` carries `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Email sent if the account exists
        "400":
          $ref: "#/components/responses/MalformedJson"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - Auth
      summary: Complete a password reset or invite
      description: |
        Sets a new password from a single-use, expiring token. Also sets the first password for invited admins and syndicate staff, activating a pending account. Success revokes all sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password set
        "400":
          $ref: "#/components/responses/InvalidOrExpiredToken"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ---------------------------------------------------------------------
  # Account
  # ---------------------------------------------------------------------
  /users/me:
    delete:
      operationId: deleteMyAccount
      tags:
        - Account
      summary: Delete the authenticated user's account
      description: |
        Marks the account deleted, revokes all sessions, and removes a specialist profile from discovery. Data is purged at purge_scheduled_for. Not available to admin or syndicate staff.
      responses:
        "200":
          description: Account deleted, purge scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ---------------------------------------------------------------------
  # Admins
  # ---------------------------------------------------------------------
  /admins:
    post:
      operationId: inviteAdmin
      tags:
        - Admins
      summary: Invite an admin
      description: Creates a `pending` admin and emails a first-password link.
      x-required-roles:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteRequest"
      responses:
        "201":
          description: Admin invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: listAdmins
      tags:
        - Admins
      summary: List admins
      x-required-roles:
        - admin
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/admins/{userId}":
    get:
      operationId: getAdmin
      tags:
        - Admins
      summary: Get an admin
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/admins/{userId}/suspend":
    post:
      operationId: suspendAdmin
      tags:
        - Admins
      summary: Suspend an admin
      description: Blocks login. Reversible with `unsuspendAdmin`.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Admin suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/admins/{userId}/unsuspend":
    post:
      operationId: unsuspendAdmin
      tags:
        - Admins
      summary: Lift an admin's suspension
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Suspension lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------------
  # User Management
  # ---------------------------------------------------------------------
  /admin/users:
    get:
      operationId: listUsers
      tags:
        - User Management
      summary: List users of any role
      description: Account-level view. Specialists who have not onboarded appear here but in no syndicate roster.
      x-required-roles:
        - admin
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: user_status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: search
          in: query
          description: Matches first name, last name, or email.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/admin/users/{userId}":
    get:
      operationId: getUser
      tags:
        - User Management
      summary: Get a user of any role
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags:
        - User Management
      summary: Update a user's account fields
      description: Account-level fields only. Role, status, and verification change through their own endpoints.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/admin/users/{userId}/suspend":
    post:
      operationId: suspendUser
      tags:
        - User Management
      summary: Suspend a non-admin user
      description: |
        Sets `UserStatus` to `suspended`, blocking login. Specialist verification is unchanged. Suspended accounts are never purged.

        `409` for admin targets (use `suspendAdmin`) and deleted accounts.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is an admin or a deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: INVALID_TARGET
                message: Target account cannot be suspended through this endpoint
  "/admin/users/{userId}/unsuspend":
    post:
      operationId: unsuspendUser
      tags:
        - User Management
      summary: Lift a non-admin user's suspension
      description: |
        Sets `UserStatus` back to `active`. Specialist verification is unchanged.

        `409` for admin targets (use `unsuspendAdmin`) and deleted accounts.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Suspension lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is an admin or a deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: INVALID_TARGET
                message: Target account cannot be unsuspended through this endpoint
  # ---------------------------------------------------------------------
  # Specialties & Conditions
  # ---------------------------------------------------------------------
  /specialties:
    get:
      operationId: listSpecialties
      tags:
        - Specialties & Conditions
      summary: List specialties
      security: []
      parameters:
        - $ref: "#/components/parameters/IsActive"
      responses:
        "200":
          description: Specialty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialty"
    post:
      operationId: createSpecialty
      tags:
        - Specialties & Conditions
      summary: Add a specialty
      x-required-roles:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyWriteRequest"
      responses:
        "201":
          description: Specialty created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialty"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/specialties/{specialtyId}":
    patch:
      operationId: updateSpecialty
      tags:
        - Specialties & Conditions
      summary: Update a specialty
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/SpecialtyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyWriteRequest"
      responses:
        "200":
          description: Specialty updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialty"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /conditions:
    get:
      operationId: listConditions
      tags:
        - Specialties & Conditions
      summary: List conditions
      description: Global list, not scoped by specialty.
      security: []
      parameters:
        - $ref: "#/components/parameters/IsActive"
        - name: search
          in: query
          description: Matches name or label.
          schema:
            type: string
      responses:
        "200":
          description: Condition list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condition"
    post:
      operationId: createCondition
      tags:
        - Specialties & Conditions
      summary: Add a condition
      x-required-roles:
        - admin
        - "syndicate_staff:any"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConditionWriteRequest"
      responses:
        "201":
          description: Condition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/conditions/{conditionId}":
    patch:
      operationId: updateCondition
      tags:
        - Specialties & Conditions
      summary: Update a condition
      x-required-roles:
        - admin
        - "syndicate_staff:any"
      parameters:
        - $ref: "#/components/parameters/ConditionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConditionWriteRequest"
      responses:
        "200":
          description: Condition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteCondition
      tags:
        - Specialties & Conditions
      summary: Delete a condition
      description: Admin only; syndicate staff can create and edit but not delete.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/ConditionId"
      responses:
        "204":
          description: Condition deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  # ---------------------------------------------------------------------
  # Countries
  # ---------------------------------------------------------------------
  /countries:
    get:
      operationId: listCountries
      tags:
        - Countries
      summary: List countries
      security: []
      parameters:
        - $ref: "#/components/parameters/IsActive"
      responses:
        "200":
          description: Country list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      operationId: createCountry
      tags:
        - Countries
      summary: Add a country
      x-required-roles:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryWriteRequest"
      responses:
        "201":
          description: Country created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/countries/{countryId}":
    get:
      operationId: getCountry
      tags:
        - Countries
      summary: Get a country
      security: []
      parameters:
        - $ref: "#/components/parameters/CountryId"
      responses:
        "200":
          description: Country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCountry
      tags:
        - Countries
      summary: Update a country
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/CountryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryWriteRequest"
      responses:
        "200":
          description: Country updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteCountry
      tags:
        - Countries
      summary: Delete a country
      description: Fails with `409` while the country is in use.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/CountryId"
      responses:
        "204":
          description: Country deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  # ---------------------------------------------------------------------
  # Syndicates
  # ---------------------------------------------------------------------
  /syndicates:
    get:
      operationId: listSyndicates
      tags:
        - Syndicates
      summary: List syndicates
      description: Public. Used by specialists to pick a syndicate during onboarding.
      security: []
      parameters:
        - name: specialty_id
          in: query
          schema:
            type: string
            format: uuid
        - name: country_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Syndicate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyndicateSummary"
    post:
      operationId: createSyndicate
      tags:
        - Syndicates
      summary: Create a syndicate with its owner
      description: |
        Creates the syndicate and a pending owner, then emails the owner a first-password link. One syndicate per country and specialty.
      x-required-roles:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyndicateCreateRequest"
      responses:
        "201":
          description: Syndicate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The country and specialty already have a syndicate, or the owner email is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                syndicateExists:
                  value:
                    status: 409
                    code: SYNDICATE_EXISTS
                    message: A syndicate for this specialty and country already exists
                emailTaken:
                  value:
                    status: 409
                    code: EMAIL_TAKEN
                    message: Email is already registered
        "422":
          $ref: "#/components/responses/ValidationError"
  "/syndicates/{syndicateId}":
    get:
      operationId: getSyndicate
