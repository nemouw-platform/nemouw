          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable summary.
        trace_id:
          type: string
          nullable: true
          description: Correlation id to quote to support.
          example: 01J8Z3F8N6K9X2Q4R7T1V5W8YB
    ValidationErrorBody:
      description: Returned only for `422`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Dot-notation for nested fields.
        code:
          type: string
          enum:
            - REQUIRED
            - MUST_BE_EMAIL
            - TOO_SHORT
            - TOO_LONG
            - TOO_COMMON
            - CONTAINS_PERSONAL_INFO
            - INVALID_ROLE
            - INVALID_FORMAT
        message:
          type: string
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorBody"
          example:
            status: 422
            code: VALIDATION_ERROR
            message: Validation failed
            errors:
              - field: email
                code: MUST_BE_EMAIL
                message: must be a valid email address
    Conflict:
      description: The resource already exists or the state does not allow the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 409
            code: USERNAME_TAKEN
            message: Username is already taken
    AccountDeleted:
      description: The account is deleted and awaiting purge
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 409
            code: ACCOUNT_DELETED
            message: The account is deleted and awaiting purge
    CredentialVerified:
      description: The credential is already verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 409
            code: CREDENTIAL_VERIFIED
            message: A verified credential cannot be changed, withdraw it and submit a new one
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 404
            code: NOT_FOUND
            message: Resource not found
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 403
            code: FORBIDDEN
            message: You do not have permission to perform this action
    OnboardingRequired:
      description: The specialist has not completed onboarding
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 403
            code: ONBOARDING_REQUIRED
            message: Complete onboarding first
    MalformedJson:
      description: Request body is missing or not valid JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 400
            code: MALFORMED_JSON
            message: Request body is not valid JSON
    Unauthorized:
      description: No session cookie, or the cookie is invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                status: 401
                code: UNAUTHENTICATED
                message: Authentication required
            invalidToken:
              value:
                status: 401
                code: INVALID_TOKEN
                message: Invalid or expired access token
    InvalidCredentials:
      description: Wrong password, unknown identifier, or an account with no password
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 401
            code: INVALID_CREDENTIALS
            message: Invalid email or password
    InvalidRefreshToken:
      description: The refresh cookie is missing, invalid, expired, or already rotated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 401
            code: INVALID_TOKEN
            message: Invalid or expired refresh token
    InvalidOrExpiredToken:
      description: The token or code is invalid, expired, or already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 400
            code: INVALID_OR_EXPIRED_TOKEN
            message: The code is invalid or has expired
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 429
            code: TOO_MANY_REQUESTS
            message: Too many requests
    FileTooLarge:
      description: The file exceeds the limit for this upload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 413
            code: FILE_TOO_LARGE
            message: The file exceeds the allowed size
    UnsupportedFileType:
      description: The file type is not allowed for this upload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 415
            code: UNSUPPORTED_FILE_TYPE
            message: File type not allowed
    InvalidFile:
      description: The file is missing or unreadable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorBody"
          example:
            status: 422
            code: VALIDATION_ERROR
            message: Validation failed
            errors:
              - field: file
                code: INVALID_FORMAT
                message: the file could not be read
    MediaBusy:
      description: Processing is at capacity; retry shortly
      headers:
        Retry-After:
          description: Seconds until the caller may retry
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 503
            code: MEDIA_BUSY
            message: Try again shortly
