          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Matches username.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Specialist page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistManagementPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ---------------------------------------------------------------------
