      parameters:
        - $ref: "#/components/parameters/SyndicateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyndicateStaffInviteRequest"
      responses:
        "201":
          description: Staff invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateStaffResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/syndicates/{syndicateId}/staff/{staffId}":
    get:
      operationId: getSyndicateStaff
      tags:
        - Syndicates
      summary: Get a staff member
      x-required-roles:
        - admin
        - "syndicate_staff:same_syndicate"
      parameters:
        - $ref: "#/components/parameters/SyndicateId"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateStaffResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSyndicateStaff
      tags:
        - Syndicates
      summary: Update a staff member's title
      x-required-roles:
        - admin
        - "syndicate_staff:owner_of_same_syndicate"
      parameters:
        - $ref: "#/components/parameters/SyndicateId"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyndicateStaffUpdateRequest"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateStaffResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: removeSyndicateStaff
      tags:
        - Syndicates
      summary: Remove a staff member
      description: |
        Deletes the staff association and the user account; access is revoked immediately. The owner cannot be removed; hand over ownership first with `changeSyndicateOwner`.
      x-required-roles:
        - admin
        - "syndicate_staff:owner_of_same_syndicate"
      parameters:
        - $ref: "#/components/parameters/SyndicateId"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "204":
          description: Staff removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is the syndicate owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: OWNER_CANNOT_BE_REMOVED
                message: The syndicate owner cannot be removed
  "/syndicates/{syndicateId}/staff/{staffId}/email":
    put:
      operationId: changePendingStaffEmail
      tags:
        - Syndicates
      summary: Fix a pending staff email and re-send the invite
      description: |
        Fixes a mistyped or expired invite while the account is pending, and re-sends it. Bypasses the resend throttle.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/SyndicateId"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyndicateStaffEmailRequest"
      responses:
        "200":
          description: Email updated, invite re-sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateStaffResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is already active, or the email is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyActive:
                  value:
                    status: 409
                    code: ACCOUNT_ALREADY_ACTIVE
                    message: This account is already active, so its email cannot be changed here
                emailTaken:
                  value:
                    status: 409
                    code: EMAIL_TAKEN
                    message: Email is already registered
        "422":
          $ref: "#/components/responses/ValidationError"
  "/syndicates/{syndicateId}/owner":
    put:
      operationId: changeSyndicateOwner
      tags:
        - Syndicates
      summary: Hand ownership to another staff member
      description: |
        The new owner must already be staff of this syndicate. The previous owner stays as regular staff.
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/SyndicateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyndicateOwnerChangeRequest"
      responses:
        "200":
          description: Ownership changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateStaffResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The staff member is already the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: ALREADY_OWNER
                message: This staff member is already the owner
        "422":
          $ref: "#/components/responses/ValidationError"
  # ---------------------------------------------------------------------
