      tags:
        - Credentials
      summary: Submit a credential
      description: Sent with its private document as multipart/form-data (JPEG, PNG, WebP, or PDF) and routed to the review queue of the specialist’s syndicate.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
      responses:
        "201":
          description: Credential submitted as `pending`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/MediaBusy"
  "/specialists/me/credentials/{credentialId}":
    get:
      operationId: getMyCredential
      tags:
        - Credentials
      summary: Get a credential
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCredential
      tags:
        - Credentials
      summary: Edit a credential
      description:
        Allowed while pending or rejected; a rejected credential returns to pending for review. 
        A verified credential cannot be edited; withdraw it and submit a new one.
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdateRequest"
