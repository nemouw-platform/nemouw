        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/credentials/{credentialId}/document":
    get:
      operationId: getCredentialDocumentLink
      tags:
        - Verification
      summary: Get a temporary link to a credential's document
      description: Returns a temporary link to the private document, for review.
      x-required-roles:
        - admin
        - "syndicate_staff:same_syndicate_as_specialist"
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
