      description: Bypasses the discovery gate, so pending, rejected and suspended profiles are included.
      x-required-roles:
        - admin
        - "syndicate_staff:same_syndicate_as_specialist"
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "200":
          description: Specialist
          content:
