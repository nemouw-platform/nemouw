              $ref: "#/components/schemas/SyndicateUpdateRequest"
      responses:
        "200":
          description: Syndicate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyndicateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/syndicates/{syndicateId}/staff":
    get:
      operationId: listSyndicateStaff
      tags:
