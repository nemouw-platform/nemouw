  "/specialists/by-id/{specialistId}/verify":
    post:
      operationId: verifySpecialist
      tags:
        - Verification
      summary: Verify a specialist
      description: Makes the profile eligible for discovery. Does not affect login.
      x-required-roles:
        - admin
        - "syndicate_staff:same_syndicate_as_specialist"
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "200":
          description: Specialist verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/specialists/by-id/{specialistId}/reject":
    post:
      operationId: rejectSpecialist
