  # ---------------------------------------------------------------------
  # Discovery and public analytics
  # ---------------------------------------------------------------------
  /specialists:
    get:
      operationId: searchSpecialists
      tags:
        - Discovery
      summary: Search specialists
      description: Public. Returns only discoverable specialists (see `SpecialistVerificationStatus`).
      security: []
      parameters:
        - name: search
          in: query
          description: Matches username and the resolved title.
          schema:
            type: string
        - name: specialty_id
          in: query
          schema:
            type: string
            format: uuid
        - name: country_id
          in: query
          schema:
            type: string
            format: uuid
        - name: city
          in: query
          schema:
            type: string
        - name: condition_id
          in: query
          schema:
            type: string
            format: uuid
        - name: language
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/LocaleQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistSearchPage"
  "/specialists/{username}":
    get:
      operationId: getPublicSpecialistProfile
      tags:
        - Discovery
      summary: Get a public profile
      description: |
        Public. `404` unless the specialist is discoverable. Hide the contact button when `whatsapp_number` is `null`. The response `locale` reports the locale actually used. `credentials` lists only verified credentials that have not expired.
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistPublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"
  "/specialists/{username}/events":
    post:
      operationId: recordAnalyticsEvent
      tags:
        - Analytics
      summary: Record a profile view or WhatsApp click
      description: |
        Public. Events are deduplicated per specialist, visitor, and event type per day; duplicates still return `202`. Events without `visitor_id` count toward totals but not unique visitors. The username is resolved to the specialist id before storage.
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventRequest"
      responses:
        "202":
          description: Event accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Session access token, set as an `HttpOnly; Secure; SameSite=Lax` cookie by login, password setup, and refresh. Browsers send it automatically.
    passwordSetupCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived setup token set by `verifySignupOtp`. Accepted only by `setInitialPassword`.
  headers:
    SetAuthCookies:
      description: |
        Sets two cookies:
        - `access_token`: `HttpOnly; Secure; SameSite=Lax; Path=/`
        - `refresh_token`: `HttpOnly; Secure; SameSite=Strict`, scoped to the auth endpoints
      schema:
        type: string
        example: access_token=eyJ...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=<seconds>
    SetSetupCookie:
      description: Sets `access_token` (`HttpOnly; Secure; SameSite=Lax; Path=/`) with no `refresh_token`, so it cannot become a session.
      schema:
        type: string
        example: access_token=eyJ...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=<seconds>
    ClearAuthCookies:
      description: Expires `access_token` and `refresh_token` with the same attributes they were set with.
      schema:
        type: string
        example: access_token=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
  parameters:
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
    IsActive:
      name: is_active
      in: query
      schema:
        type: boolean
    LocaleQuery:
      name: locale
      in: query
      description: Locale for localized fields; falls back to the default.
      schema:
        $ref: "#/components/schemas/Locale"
    LocalePath:
      name: locale
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Locale"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SyndicateId:
      name: syndicateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpecialistId:
      name: specialistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpecialtyId:
      name: specialtyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CountryId:
      name: countryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
  schemas:
    Role:
      type: string
      enum:
        - admin
        - syndicate_staff
        - specialist
        - patient
    SignupRole:
      type: string
      description: Roles that can self-register.
      enum:
        - specialist
    UserStatus:
      type: string
      description: |
        Account login status.
        - `pending`: signed up or invited, not yet activated.
        - `active`: can log in.
        - `suspended`: blocked by moderation; never purged.
        - `deleted`: blocked; purged after a retention period.
      enum:
        - pending
        - active
        - suspended
        - deleted
    SpecialistVerificationStatus:
      type: string
      description: |
        Verification status of a specialist profile, independent of `UserStatus`. Suspend and unsuspend change only `UserStatus`; verify and reject change only this field.
        Login requires `UserStatus = active`. Discovery requires `UserStatus = active` and verification `active`.
      enum:
        - pending
        - active
        - rejected
      default: pending
    Locale:
      type: string
      enum:
        - en
        - ar
        - fr
      default: en
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        user_status:
          $ref: "#/components/schemas/UserStatus"
        created_at:
          type: string
          format: date-time
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            country_id:
              type: string
              format: uuid
              nullable: true
            preferred_language:
              type: string
              nullable: true
            last_login_at:
              type: string
              format: date-time
              nullable: true
            deleted_at:
              type: string
              format: date-time
              nullable: true
    UserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        country_id:
          type: string
          format: uuid
          nullable: true
        preferred_language:
          type: string
          nullable: true
    UserPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserDetail"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SignupRequest:
      type: object
      required:
        - role
        - first_name
        - last_name
        - email
      properties:
        role:
          $ref: "#/components/schemas/SignupRole"
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        locale:
          $ref: "#/components/schemas/Locale"
    SignupResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        otp_expires_at:
          type: string
          format: date-time
    VerifyOtpRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          example: "482913"
    ResendOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        locale:
          $ref: "#/components/schemas/Locale"
    PasswordSetupResponse:
      type: object
      required:
        - expires_in
      properties:
        expires_in:
          type: integer
          description: Setup cookie lifetime in seconds.
          example: 900
    SetPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email, phone, or username.
        password:
          type: string
          format: password
    SessionResponse:
      type: object
      required:
        - user_id
        - role
        - expires_in
      properties:
