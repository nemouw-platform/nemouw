        - Verification
      summary: Reject a specialist
      description: Removes the profile from discovery. Does not affect login. A later `verifySpecialist` reinstates it.
      x-required-roles:
        - admin
        - "syndicate_staff:same_syndicate_as_specialist"
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      requestBody:
