              schema:
                $ref: "#/components/schemas/SpecialistResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountDeleted"
  # ---------------------------------------------------------------------
  # Specialists
  # ---------------------------------------------------------------------
  /specialists/me:
    post:
      operationId: createMySpecialistProfile
      tags:
        - Specialists
      summary: Complete onboarding
      description: |
        Creates the specialist profile with the required fields; everything else starts `null`. `specialty_id` is derived from `syndicate_id`; `verification_status` starts `pending`.

        Until this succeeds, other `/specialists/me/**` endpoints, including image and credential-document uploads, return `403 ONBOARDING_REQUIRED`.
      x-required-roles:
        - "specialist:not_onboarded"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistOnboardingRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: getMySpecialistProfile
      tags:
        - Specialists
      summary: Get the authenticated specialist's profile
      description: Locale-specific content lives under `/specialists/me/profiles/{locale}`.
      responses:
        "200":
          description: Specialist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistResponse"
        "404":
          description: Onboarding is not complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                code: SPECIALIST_NOT_FOUND
                message: Specialist not found, complete onboarding first
    patch:
      operationId: updateMySpecialistProfile
      tags:
        - Specialists
      summary: Update the authenticated specialist's profile
      description: |
        Partial update. syndicate_id is locked after verification and needs syndicate_member_number in the same request. min_age_treated must not exceed max_age_treated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistUpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistResponse"
        "403":
          $ref: "#/components/responses/OnboardingRequired"
        "409":
          description: Username or member number taken, or syndicate locked after verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 409
                code: SYNDICATE_LOCKED
                message: The syndicate cannot be changed after verification
        "422":
          $ref: "#/components/responses/ValidationError"
