services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend:/app
      - maven_repo:/root/.m2
    ports:
      - "8080:8080"
      - "5005:5005"
    command: >
      mvn spring-boot:run
      -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      db:
        condition: service_healthy

    develop:
      watch:
        # Rebuild the container when a Java file changes so it recompiles and re-executes automatically
        - path: ./backend/src/main/java
          action: rebuild

        # Completely rebuild the image target if you add a new maven dependency
        - path: ./backend/pom.xml
          action: rebuild

  # Loads the reference data (Lebanon, two specialties and their syndicates)
  # once the backend is up, so onboarding has something to pick. Runs once
  # and exits; safe on every start. Local only, never in production.
  seed:
    image: postgres:18-alpine
    env_file: .env
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./frontend/apps/web/e2e/fixtures/dev-seed.sql:/seed/dev-seed.sql:ro
    # The backend answers once Flyway has created the tables
    command: >
      sh -c 'until wget -q -O /dev/null http://backend:8080/v1/countries; do
      echo "waiting for the backend..."; sleep 5; done;
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /seed/dev-seed.sql'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The public site, built like production (rebuild to see code changes:
  # docker compose up -d --build web)
  web:
    build:
      context: ./frontend
      args:
        APP: web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

  # The staff dashboard, same image recipe
  admin:
    build:
      context: ./frontend
      args:
        APP: admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maven_repo:
  postgres_data: